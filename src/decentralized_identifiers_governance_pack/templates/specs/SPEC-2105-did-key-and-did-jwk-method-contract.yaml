  "references": ["https://w3c-ccg.github.io/did-method-key/", "https://github.com/quartzjer/did-jwk/blob/main/spec.md"],
  "body": "## Requirements\n\n- Implementations claiming did:key support must declare supported multicodec key types and generated document behavior.\n- Implementations claiming did:jwk support must declare supported JWK key types, encoding rules, and generated document behavior.\n- Generated verification methods and verification relationships must be valid for the declared consumer profile.\n- Unsupported key types, malformed encoded material, and invalid generated documents must fail closed.\n\n## Evidence Expectations\n\n- Fixtures for supported did:key and did:jwk identifiers, unsupported key type, malformed encoded key, generated DID document validation, and proof-purpose-specific verification relationship checks.\n"
