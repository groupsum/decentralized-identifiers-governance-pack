  "references": ["https://identity.foundation/didwebvh/", "https://identity.foundation/ion/", "https://github.com/uport-project/ethr-did-resolver", "https://github.com/w3c-ccg/did-pkh/blob/main/did-pkh-method-draft.md"],
  "body": "## Requirements\n\n- Implementations must declare support for did:webvh, did:ion, did:ethr, and did:pkh independently.\n- Method-specific resolution must document required network, ledger, chain, history, key, and cache behavior.\n- Method-specific lifecycle operations must be declared separately from read-time resolution.\n- Unsupported networks, chains, histories, ledgers, method variants, and key encodings must fail closed.\n\n## Evidence Expectations\n\n- Fixtures or mocks for each declared method, including unsupported network or chain, invalid history or ledger state, unavailable resolver resource, malformed method identifier, and valid DID document output.\n"
